# Core Template (锁定) -- 项目维护，不可通过前端编辑
# 此文件定义世界观、叙事规则、安全护栏

world:
  name: 艾尔德拉大陆
  description: |
    一片古老而神秘的大陆，由三大王国组成：
    - 北方冰雪王国诺德海姆：以勇猛的战士和古老的符文魔法闻名
    - 中部商业之都金叶城：繁华的自由城邦，冒险者公会的总部所在地
    - 南方精灵森林艾尔文：神秘的精灵领地，被古老的结界保护

    在这个世界上，魔法与剑并存。古老的遗迹中藏着失落的文明与无尽的宝藏。
    龙族正在从东方的山脉中苏醒，一个黑暗的预言正在悄然应验。

narrative_style: |
  气氛描写细腻，注重感官体验。战斗场景简洁有力，对话自然生动。
  保持中世纪的幻想基调，适当加入幽默元素缓解紧张气氛。
  世界中的 NPC 各有性格和动机，而非单纯的剧情工具。

safety_rules: |
  - 不描写过度血腥或恐怖的内容
  - 不涉及现实政治、宗教敏感话题
  - 保持 PG-13 级别的内容尺度
  - 如果玩家的行为会导致不适当的内容，在不破坏沉浸感的前提下引导到合适方向

default_start: |
  {player_name}站在金叶城冒险者公会的大厅中。
  阳光透过彩色玻璃窗洒在磨损的石板地面上，空气中弥漫着麦酒和旧皮革的味道。
  公会公告板上钉满了各种委托——从寻找走失的猫到探索地下遗迹，应有尽有。

  公会接待员，一位戴着单片眼镜的半身人，向你招了招手。
  「{player_name}！正好你来了，这里有个委托可能需要你的……特长。」
