description: 'Qwqw是一个漂浮在无尽虚空中的碎片世界，由无数悬浮的岛屿和扭曲的空间褶皱构成。传说中，这个世界是某个远古文明最后的回响，其名字“Qwqw”在失落语言中意为“双重回声”。地理上，核心区域是“镜海”——一片倒映着天空的液态记忆平原，四周环绕着“折光山脉”，山脉的岩石会折射出不同时间线的景象。历史始于一场“静默浩劫”，所有已知的物理规则被重写，留下了一些被称为“谐律碎片”的遗物。主要势力包括：维护空间稳定的“秩序织造者”、探寻旧日知识的“回响学者”、以及信奉混沌本源的“涡流教派”。种族主要有：灵质态的人类后裔“虹民”，他们能微调自身频率以适应不同岛屿的重力；以及由几何体构成的“棱晶智灵”，它们通过振动交流。

  '
name: qwqw_realm
starting_scene: '{player_name}睁开眼，发现自己站在一片泛着珍珠光泽的草地上。头顶没有天空，只有一片倒悬的海洋，里面游着发光的螺旋生物。脚下草地延伸十米后突然断裂，边缘漂浮着破碎的岩石，露出下方无尽的深紫色虚空。远处，一座倒金字塔状的岛屿缓慢旋转，其底部垂下一道由光织成的阶梯。耳边传来若有若无的双重低语，像是某人正在念诵你的名字——但其中一个声音来自你自己的记忆深处。'
