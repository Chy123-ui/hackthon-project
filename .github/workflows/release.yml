name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r backend/requirements.txt
      - run: python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app"

  release:
    if: startsWith(github.ref, 'refs/heads/main') && github.event_name == 'push'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m venv release\re-life\.venv
          release\re-life\.venv\Scripts\pip install -r backend\requirements.txt
      - run: |
          mkdir release\re-life\data
          xcopy backend\app release\re-life\app /E /I
          xcopy backend\protocol release\re-life\protocol /E /I
          xcopy backend\default_worlds release\re-life\default_worlds /E /I
          xcopy frontend\dist release\re-life\dist /E /I
          copy backend\run.py release\re-life\run.py
      - run: |
          echo @echo off > release\re-life\start.bat
          echo cd /d "%%~dp0" >> release\re-life\start.bat
          echo start "" http://localhost:8000 >> release\re-life\start.bat
          echo .venv\Scripts\python run.py >> release\re-life\start.bat
      - run: Compress-Archive -Path release\re-life -DestinationPath release\re-life.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: release/re-life.zip
          tag_name: latest
          name: Latest Build
          body: Auto-built from ${{ github.sha }}
          prerelease: true
