name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r backend/requirements.txt
      - run: python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app"

  release:
    if: startsWith(github.ref, 'refs/heads/main') && github.event_name == 'push'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install pyinstaller
          pip install -r backend/requirements.txt
      - run: |
          cd backend
          pyinstaller --onefile --noconsole `
            --add-data "protocol;protocol" `
            --add-data "default_worlds;default_worlds" `
            --add-data "../frontend/dist;dist" `
            --name "re-life" `
            launcher.py
          mkdir ../release
          move dist/re-life.exe ../release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/re-life.exe
          tag_name: latest
          name: Latest Build
          body: Auto-built from ${{ github.sha }}
          prerelease: true
