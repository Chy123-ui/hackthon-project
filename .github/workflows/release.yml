name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build and package
        run: bash build.sh

      - name: Generate version tag
        id: version
        run: |
          TAG="v$(date +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/re-life.zip
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Auto-built from [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            ### 使用方式
            1. 下载 `re-life.zip` 并解压
            2. Windows: 双击 `start.bat` 启动
            3. macOS / Linux: 终端运行 `chmod +x start.sh && ./start.sh`
            4. 浏览器打开 http://localhost:8000

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --force latest
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" latest
