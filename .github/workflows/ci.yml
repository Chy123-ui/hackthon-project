name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify backend imports
        run: python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r backend/ -f sarif -o bandit-results.sarif -x backend/tests/ || true
        continue-on-error: true

      - name: Run Safety (dependency scan)
        run: |
          pip install safety
          safety check -r backend/requirements.txt --ignore 70612 || true
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

      - name: Run ruff check
        run: |
          pip install ruff
          ruff check backend/ || true
        continue-on-error: true
